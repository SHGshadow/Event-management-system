<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S&S Eventro | Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="signin-container">
    <div class="signin-box">
      <h2>Sign In</h2>
      <form>
        <div class="input-group">
          <input type="text" placeholder="Username" required>
        </div>
        <div class="input-group">
          <input type="password" placeholder="Password" required>
        </div>
        <div class="forgot">
          <a href="#">Forgot Password?</a>
        </div>
        <button type="submit" class="btn signin-btn">Sign In</button>
      </form>

      <div class="divider"><span>OR</span></div>

      <button class="btn create-btn">Create Account</button>

      <p class="help-text">
        Need help? Email: <span>sample@gmail.com</span>
      </p>

      <button onclick="window.location.href='index.html'" class="btn back-btn">Back</button>

      
    </div>
  </div>

  <footer>
    <p>© Designed and Developed by Faculty Of Computing</p>
    <div class="links">
      <a href="#">Terms & Conditions</a> | 
      <a href="#">Privacy Policy</a> | 
      <a href="#">Accessibility Statement</a> | 
      <a href="#">Site Map</a>
    </div>
    <p>Last Updated: Jul 21 2024</p>
  </footer>
</body>
</html>
