<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S&S Eventro | Create Account</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Signup Section -->
  <div class="signup-page">

    <div class="signup-overlay"></div>

    <div class="signup-content">
      <h1 class="signup-title">Create Account</h1>

      <form class="signup-form">

        <div class="signup-grid">

          <!-- Left Column -->
          <div class="signup-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="signup-group">
            <label for="mobile">Mobile Number</label>
            <input type="text" id="mobile" name="mobile" required>
          </div>

          <div class="signup-group">
            <label for="username">User Name</label>
            <input type="text" id="username" name="username" required>
          </div>

          <div class="signup-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>

          <div class="signup-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required>
          </div>

          <div class="signup-group">
            <label for="confirmPassword">Verify Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
          </div>

        </div>

        <!-- Register Button -->
        <div class="signup-btn-wrap">
          <button type="submit" class="btn register-btn">Register</button>
        </div>

        <!-- Help Text -->
        <p class="signup-help">
          Need help? Email : <span>sample@gmail.com</span>
        </p>

        <!-- Back Button -->
        <div class="signup-back-wrap">
          <button type="button" class="btn signup-back-btn" onclick="window.location.href='signin.html'">Back</button>
        </div>

      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="signup-footer">
    <p>© Designed and Developed by Faculty Of Computing</p>
    <div class="links">
      <a href="#">Terms & Conditions</a> |
      <a href="#">Privacy Policy</a> |
      <a href="#">Accessibility Statement</a> |
      <a href="#">Last Updated : Jul 21 2024</a> |
      <a href="#">Site Map</a>
    </div>
  </footer>

</body>
</html>
