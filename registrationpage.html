<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Event Registration</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <img src="images/logo-removebg-preview.png" class="rounded-pill">
    </a>

    <div class="collapse navbar-collapse justify-content-end">
      <ul class="navbar-nav">
        <li><a class="nav-link" href="index.html">Home</a></li>
        <li><a class="nav-link" href="signin.html">Signin</a></li>
        <li><a class="nav-link" href="#">Events</a></li>
        <li><a class="nav-link" href="#">About</a></li>
        <li><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Section -->
<div class="reg-section">

  <div class="container">

    <h1 class="reg-title">MUSIC EVENT</h1>

    <form class="reg-form">

      <div class="form-row">
        <label>Name</label>
        <input type="text">
      </div>

      <div class="form-row">
        <label>Mobile No.</label>
        <input type="text">
      </div>

      <div class="form-row">
        <label>Email</label>
        <input type="email">
      </div>

      <div class="form-row">
        <label>Ticket Category</label>
        <select>
          <option>Select Category</option>
          <option>Front Seats - Rs.5000</option>
          <option>Back Seats - Rs.4000</option>
          <option>General - Rs.2500</option>
        </select>
      </div>

      <div class="form-row">
        <label>No. of Tickets</label>
        <input type="number">
      </div>

      <div class="terms">
          <input type="checkbox">
          <span>Agree to terms and conditions</span>
      </div>    

      <button class="btn btn-warning fw-bold buy-btn">Buy Tickets</button>

    </form>

  </div>
</div>

</html>
